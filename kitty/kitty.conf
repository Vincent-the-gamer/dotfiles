# vim:fileencoding=utf-8:foldmethod=marker

# Theme
# Tropical Neon
include tropical-neon.conf

# Fonts
font_size 13
font_family      family="Input"
bold_font        auto
italic_font      auto
bold_italic_font auto

# window
hide_window_decoraions titlebar-only
window_padding_width 12
background_opacity 0.8
background_blur 30
remember_window_size yes

# tab bar
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# general key mapping
macos_option_as_alt yes

# Shaders
## Cursor
cursor_trail 3
### Custom shader: neon-text (./shaders/neon-*), usage see ./shaders/README.md
custom_shaders neon-text cursor-trail-motion-blur